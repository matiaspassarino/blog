name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, unitarios y calidad
    runs-on: ubuntu-latest
    # Valores ficticios para que astro build pase la validación de astro:env (spec 002, T011).
    env:
      PUBLIC_URL_SITIO: http://localhost:4321
      PUBLIC_SUPABASE_URL: http://127.0.0.1:56321
      PUBLIC_SUPABASE_ANON_KEY: clave-anon-ficticia-para-el-build
      SECRETO_REVALIDACION: secreto-ficticio-de-ci-de-32-caracteres-o-mas
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm formato:verificar
      - run: pnpm lint
      - run: pnpm typecheck
      # Los tests de integración de @blog/db necesitan Supabase: corren en el job base-de-datos.
      - run: pnpm turbo run test --filter='!@blog/db'
      - run: pnpm calidad
      - run: pnpm build

  base-de-datos:
    name: pgTAP e integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start
      - run: supabase test db
      - run: pnpm install --frozen-lockfile
      - name: Tests de integración de @blog/db
        run: pnpm --filter @blog/db test
        env:
          CI: 'true'

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - name: Variables de apps/web para los E2E
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          {
            echo "PUBLIC_URL_SITIO=http://localhost:4321"
            echo "PUBLIC_SUPABASE_URL=$API_URL"
            echo "PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            grep '^SECRETO_REVALIDACION=' .env.example
          } > apps/web/.env.local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
